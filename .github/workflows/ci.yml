name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Check targets
        run: cargo +stable check --all-targets --locked

      - name: Run tests
        run: cargo +stable test --all-targets --locked

      - name: Run clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --locked

      - name: Check minimum supported Rust
        run: cargo +1.94.0 check --lib --locked

      - name: Verify package
        run: cargo +stable package --locked
